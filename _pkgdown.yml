url: https://daikikumakura.github.io/rsemverse/

template:
  bootstrap: 5

home:
  title: "rsemverse: from RSEM gene results to analysis-ready gene tables"
  description: >-
    Read RSEM gene results into a gene symbol by sample table, then filter,
    select, normalize and transform it, and turn it into a long table, for
    human and mouse bulk RNA-seq.

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

reference:
  - title: "Step 1: Read"
    desc: "RSEM files and a sample table in, one gene symbol by sample table out."
    contents:
      - rsem_read
  - title: "Step 2: Filter"
    desc: "See what each threshold keeps, then remove lowly expressed genes or keep the most variable ones."
    contents:
      - rsem_detection_curve
      - rsem_filter
  - title: "Step 3: Select genes"
    desc: "Keep or remove gene groups from the OrgDb or a GTF file; see their share per sample."
    contents:
      - rsem_subset
      - rsem_biotype_profile
      - rsem_check
      - rsem_reconcile
      - rsem_id_report
      - rsem_mapping_qc
      - rsem_sample_qc
  - title: "Step 4: Normalize"
    desc: "Make samples comparable: CPM, TMM, upper quartile, DESeq2, quantile."
    contents:
      - rsem_normalize
  - title: "Step 5: Transform"
    desc: "log2, z-score, centering and ranks for plots, clustering and scores."
    contents:
      - rsem_transform
      - rsem_fit_reference
  - title: "Step 6: Long table and files"
    desc: "One row per gene and sample, with the sample table, for ggplot2; or a TSV with gene IDs and types."
    contents:
      - rsem_long
      - rsem_write
  - title: "Transcripts and effective lengths"
    contents:
      - rsem_select_isoforms
      - rsem_length_profile
  - title: Package
    contents:
      - rsemverse-package

articles:
  - title: Articles
    navbar: ~
    contents:
      - articles/workflow
      - articles/from-scripts
