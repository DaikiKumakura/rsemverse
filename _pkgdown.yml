url: https://daikikumakura.github.io/rsemverse/

template:
  bootstrap: 5
  bslib:
    bg: "#ffffff"
    fg: "#252525"
    primary: "#25577b"
    border-color: "#dddddd"
    line-height-base: 1.65
    headings-font-weight: 500

home:
  title: "rsemverse: RSEM results in R, one step at a time, with the pipe"
  description: >-
    Read RSEM results, check them, and filter, normalize and transform them
    with |> into tables for plots, scores, DESeq2 and Bioconductor.

navbar:
  bg: light
  type: light
  structure:
    left: [start, reference, articles, news, downloads]
    right: [search, github]
  components:
    start:
      text: Get started
      menu:
        - text: Install
          href: "index.html#installation"
        - text: First example
          href: "index.html#quick-start"
    downloads:
      text: Downloads
      menu:
        - text: Release
          href: "https://github.com/DaikiKumakura/rsemverse/releases/tag/v0.8.0"
        - text: R-universe
          href: "https://daikikumakura.r-universe.dev/rsemverse"
        - text: Zenodo
          href: "https://doi.org/10.5281/zenodo.24545434"
        - text: Portfolio
          href: "https://daikikumakura.github.io/software/rsemverse.html"

reference:
  - title: "Read"
    desc: "RSEM files in, a table of gene symbols by samples out."
    contents:
      - rsem_read
      - rsem_import
  - title: "Prepare"
    desc: "Each takes a table and returns a table, so they chain with |>."
    contents:
      - rsem_filter
      - rsem_subset
      - rsem_normalize
      - rsem_transform
      - rsem_fit_reference
      - rsem_apply_reference
      - rsem_reference_scale
      - rsem_steps
  - title: "Check the files"
    contents:
      - rsem_check
      - rsem_reconcile
      - rsem_id_report
  - title: "QC"
    contents:
      - rsem_sample_qc
      - rsem_qc_summary
      - rsem_mapping_qc
      - rsem_alignment_profile
      - rsem_model_qc
      - rsem_noise_qc
      - rsem_biotype_profile
      - rsem_length_profile
      - rsem_detection_curve
  - title: "Transcripts"
    contents:
      - rsem_select_isoforms
      - rsem_isoform_usage
  - title: "Hand over"
    desc: "A long table for ggplot2, files, DESeq2 and Bioconductor."
    contents:
      - rsem_long
      - rsem_write
      - rsem_as_tximport
      - rsem_as_summarizedexperiment
  - title: Package
    contents:
      - rsemverse-package

articles:
  - title: Articles
    navbar: ~
    contents:
      - articles/workflow
      - articles/from-scripts
